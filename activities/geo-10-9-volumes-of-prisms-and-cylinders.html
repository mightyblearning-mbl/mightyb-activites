<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volume Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  color-scheme:dark;
  --sky:#14213D; --sky-deep:#0E1830; --panel:#1E2F55; --panel-2:#26396A; --line:#34497D;
  --moon:#F3EFE0; --muted:#A3AECB; --star:#FFD166; --star-dim:#4A5A86;
  --mint:#7BDCB5; --mint-ink:#0F3B2E; --lilac:#B8A6FF;
  --star-text:#FFD166; --sky-top:#22346A; --panel-b:#1A2A4E; --well:rgba(0,0,0,.25); --hover:#4B63A3; --btn-ink:#2B2208;
  --boss:#FF9E7A;
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
:root[data-bg="light"]{color-scheme:light;--sky:#F4F6FB;--sky-deep:#E6EAF3;--sky-top:#FFFFFF;--panel:#FFFFFF;--panel-2:#EEF1F8;--panel-b:#F8F9FD;--line:#C5CEE0;
  --moon:#1B2440;--muted:#4F5A73;--star:#F5B83D;--star-text:#8A5A00;--star-dim:#B7C0D6;--mint:#1F8A63;--mint-ink:#FFFFFF;--lilac:#5B45C9;--well:rgba(27,36,64,.06);--hover:#8FA2CC;--boss:#C2410C}
:root[data-bg="cream"]{color-scheme:light;--sky:#FBF6E9;--sky-deep:#F2EAD3;--sky-top:#FFFDF6;--panel:#FFFCF3;--panel-2:#F4EDDA;--panel-b:#FBF6E8;--line:#D9CBA6;
  --moon:#2A2418;--muted:#62573F;--star:#F0B43A;--star-text:#855600;--star-dim:#CDBF9A;--mint:#23805E;--mint-ink:#FFFFFF;--lilac:#5E4AB8;--well:rgba(60,45,10,.06);--hover:#C7B480;--boss:#B4410F}
:root[data-size="1"] .wrap{zoom:1.15}
:root[data-size="2"] .wrap{zoom:1.32}
:root[data-spacing="1"] body{letter-spacing:.05em;word-spacing:.16em;line-height:1.85}
:root[data-calm="1"] *{animation:none!important;transition:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,var(--sky-top) 0%,var(--sky) 55%,var(--sky-deep) 100%) fixed,var(--sky);color:var(--moon);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible,.zone:focus-visible{outline:3px solid var(--star);outline-offset:3px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,5vw,34px);line-height:1;margin:0}
.brand h1 span{color:var(--star-text)}
.brand small{color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.pill svg{width:16px;height:16px}
.proto{font-size:13px;color:var(--muted);background:rgba(184,166,255,.08);border:1px dashed rgba(184,166,255,.35);border-radius:10px;padding:8px 12px}
.proto b{color:var(--lilac)}
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.con{background:transparent;border:1px solid transparent;border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.con:hover{border-color:var(--line)}
.con[aria-current="step"]{background:rgba(255,209,102,.07);border-color:rgba(255,209,102,.35);color:var(--moon)}
.con svg{width:100%;max-width:120px;height:auto;aspect-ratio:12/9}
.con .nm{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.1;text-align:center}
.con .sk{font-size:11.5px;text-align:center;line-height:1.2}
.con.done .nm{color:var(--star-text)}
.con.boss .nm{color:var(--boss)}
.con.locked{opacity:.55}
@media (max-width:560px){.map{gap:2px}.con .sk{display:none}.con .nm{font-size:12px}}
.card{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-b) 100%);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 50px -30px rgba(0,0,0,.7)}
.card.bosscard{border-color:var(--boss);box-shadow:0 0 0 2px rgba(255,158,122,.25),0 20px 50px -30px rgba(0,0,0,.7)}
.eyebrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow .lv{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow .lv b{color:var(--star-text);font-weight:700}
.bosscard .eyebrow .lv b{color:var(--boss)}
.starrow{display:flex;gap:4px}
.starrow svg{width:22px;height:22px}
.prompt{font-family:var(--display);font-weight:600;font-size:clamp(22px,4.2vw,30px);line-height:1.2;margin:0;text-wrap:balance}
.prompt .num{color:var(--star-text)}
.sub{color:var(--muted);margin:-8px 0 0;max-width:62ch}
.readbtn{align-self:flex-start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.tile{background:var(--panel-2);border:2px solid var(--line);border-radius:var(--r);min-height:60px;font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;transition:transform .12s ease,background .15s,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--hover)}
.tile[aria-pressed="true"]{background:var(--star);color:var(--btn-ink);border-color:var(--star)}
.tile.locked{background:var(--mint);color:var(--mint-ink);border-color:var(--mint);cursor:default;transform:none}
.tile.nope{border-color:var(--lilac);border-style:dashed;color:var(--muted);background:transparent}
.tile.small{min-height:50px;font-size:20px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:none;border-radius:999px;padding:12px 22px;font-family:var(--display);font-weight:700;font-size:18px;background:var(--star);color:var(--btn-ink);transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none;filter:grayscale(1)}
.btn.ghost{background:transparent;color:var(--lilac);border:2px solid rgba(184,166,255,.5)}
.btn.soft{background:var(--panel-2);color:var(--moon);border:1px solid var(--line)}
.fb{border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;font-size:16.5px}
.fb svg{flex:none;width:26px;height:26px;margin-top:1px}
.fb.good{background:rgba(123,220,181,.12);border:1px solid rgba(123,220,181,.45)}
.fb.good strong{color:var(--mint)}
.fb.look{background:rgba(184,166,255,.10);border:1px solid rgba(184,166,255,.45)}
.fb.look strong{color:var(--lilac)}
.fb.hint{background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.35)}
.fb.hint strong{color:var(--star-text)}
.fb p{margin:0}
.fb p+p{margin-top:6px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:14px;background:var(--well);border:1px dashed var(--line)}
.chip{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;min-width:52px;height:46px;padding:0 10px;font-family:var(--display);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;touch-action:none;user-select:none}
.chip[aria-pressed="true"]{border-color:var(--star);box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.zones{grid-template-columns:1fr}}
.zone{border:2px solid var(--line);border-radius:18px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.02);text-align:left}
.zone.over{border-color:var(--star);background:rgba(255,209,102,.12)}
.zone .zl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.zone .zl b{color:var(--moon);font-family:var(--display);font-size:18px;letter-spacing:0;text-transform:none}
.zone .zc{display:flex;flex-wrap:wrap;gap:6px}
.zone .chip{height:40px;min-width:46px;font-size:19px}
.tray.zone{flex-direction:row;align-items:center;min-height:62px;border-style:dashed}
/* factor builder */
.builder{display:flex;flex-direction:column;gap:12px}
.eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:32px;font-variant-numeric:tabular-nums}
.slot{min-width:84px;height:62px;border-radius:14px;background:var(--well);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;padding:0 12px;font:inherit;color:var(--moon)}
.slot[aria-pressed="true"]{border-color:var(--star);box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.slot.empty{color:var(--muted);font-family:var(--body);font-weight:400;font-size:15px}
.found{display:flex;flex-wrap:wrap;gap:8px}
.found .fp{border:2px solid var(--mint);color:var(--mint);border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.found .ghostp{border:2px dashed var(--line);color:var(--muted);border-radius:999px;padding:4px 14px;font-size:15px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px}
.pad button{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;height:54px;font-family:var(--display);font-weight:700;font-size:22px}
.pad button:hover{border-color:var(--hover)}
/* boss sky */
.skyfield{position:relative;border-radius:16px;background:var(--well);border:1px solid var(--line);overflow:hidden}
.skyfield svg{display:block;width:100%;height:auto}
.hgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px 8px;padding:20px 12px 24px;justify-items:center}
.hstar{width:clamp(48px,13vw,62px);aspect-ratio:1;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle at 35% 30%,var(--panel-2),var(--sky-deep));font-family:var(--display);font-weight:700;font-size:clamp(18px,4.6vw,22px);color:var(--moon);font-variant-numeric:tabular-nums;transition:transform .15s,box-shadow .2s}
.hstar:hover:not(:disabled){border-color:var(--hover)}
.hstar.on{background:var(--boss);border-color:var(--boss);color:var(--btn-ink);box-shadow:0 0 0 6px rgba(255,158,122,.18),0 0 22px rgba(255,158,122,.55)}
.hstar.no{opacity:.35;border-style:dashed;border-color:var(--lilac)}
.hstar:disabled{cursor:default}
.cele{text-align:center;align-items:center}
.cele svg.big{width:min(320px,90%);height:auto}
.cele .prompt{max-width:22ch}
.summary{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.summary th,.summary td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.summary th{color:var(--muted);font-weight:400;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.tablewrap{overflow-x:auto;width:100%}
footer.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13.5px}
.linkish{background:none;border:none;color:var(--lilac);text-decoration:underline;text-underline-offset:3px;padding:0}
.report{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.report label{display:flex;gap:8px;align-items:center}
.report textarea{font:inherit;background:var(--well);color:var(--moon);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:70px;resize:vertical}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.twinkle{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.55}}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--star);color:var(--btn-ink);font-family:var(--display);font-weight:700;padding:8px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.35);z-index:10;animation:toast 1.3s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
.settings{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.settings h2{margin:0;font-family:var(--display);font-size:22px}
.settings .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.settings .lbl{min-width:150px;font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--panel-2);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-size:15px}
.seg button[aria-pressed="true"]{border-color:var(--star);background:var(--star);color:var(--btn-ink);font-weight:700}
.settings .note{color:var(--muted);font-size:14px;margin:0}
.reading{outline:3px solid var(--lilac);outline-offset:4px;border-radius:10px;background-color:rgba(184,166,255,.10)}
.fbread{background:none;border:1px solid currentColor;border-radius:999px;color:inherit;padding:3px 10px;font-size:13px;margin-top:8px;display:inline-flex;gap:6px;align-items:center}
.fbread svg{width:14px;height:14px;margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .tl{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.toolbar .pill[aria-pressed="true"]{border-color:var(--lilac);color:var(--moon);background:rgba(184,166,255,.18)}
.tool{border:1px dashed var(--lilac);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--well)}
.tool .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tool .ctl .seg button{padding:5px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.tool .cap{margin:0;font-size:16.5px;max-width:62ch}
.tool .scroll{overflow-x:auto}
.notebox{border-left:4px solid var(--star);background:var(--well);border-radius:0 12px 12px 0;padding:10px 14px;font-size:15.5px}
.notebox b{color:var(--star-text)}

@media (max-width:480px){table.summary{font-size:12.5px;width:100%}table.summary th,table.summary td{padding:6px 4px}table.summary th{white-space:normal;line-height:1.15;letter-spacing:0}.cele table.summary th:nth-child(2),.cele table.summary td:nth-child(2){display:none}table.summary td:first-child{min-width:6.5em}}

/* ---- quest engine widgets (added to the Prime Constellations look) ---- */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.choice{background:var(--panel-2);border:2px solid var(--line);border-radius:16px;padding:14px 16px;text-align:left;font-size:18px;line-height:1.35;min-height:58px;transition:transform .12s,border-color .15s}
.choice:hover:not(:disabled){transform:translateY(-2px);border-color:var(--hover)}
.choice.right{background:var(--mint);color:var(--mint-ink);border-color:var(--mint);font-weight:700}
.choice.out{opacity:.4;border-style:dashed;border-color:var(--lilac);text-decoration:line-through}
.choice:disabled{cursor:default}
.choice .math,.math{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.entry{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums}
.entry .box{min-width:120px;height:62px;border-radius:14px;background:var(--well);border:2px solid var(--star);display:inline-flex;align-items:center;justify-content:center;padding:0 16px;color:var(--moon)}
.entry .box.empty{color:var(--muted);font-family:var(--body);font-weight:400;font-size:15px;border-color:var(--line)}
.pad.wide{grid-template-columns:repeat(4,1fr);max-width:380px}
.eqline{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);font-variant-numeric:tabular-nums;letter-spacing:.02em;background:var(--well);border:1px solid var(--line);border-radius:16px;padding:12px 18px;align-self:flex-start}
.eqline .hl{color:var(--star-text)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .08em;font-size:.82em}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .12em .06em}
.frac>span:last-child{padding:.06em .12em 0}
.seq{display:flex;flex-direction:column;gap:8px;counter-reset:s}
.seq .slotline{display:flex;align-items:center;gap:10px;min-height:52px;border-radius:14px;border:2px dashed var(--line);padding:6px 10px;background:var(--well)}
.seq .slotline::before{counter-increment:s;content:counter(s);font-family:var(--display);font-weight:800;color:var(--star-text);width:24px;text-align:center}
.seq .slotline .stepchip{flex:1}
.stepchip{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:10px 14px;text-align:left;font-size:17px;line-height:1.3}
.stepchip:hover:not(:disabled){border-color:var(--hover)}
.stepchip.done{border-color:var(--mint);background:rgba(123,220,181,.12)}
.bank{display:flex;flex-direction:column;gap:8px}
.factline{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:24px}
.factline .lbl{min-width:70px}
.pchip{min-width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--panel-2);font-family:var(--display);font-weight:700;font-size:21px}
.pchip[aria-pressed="true"]{background:var(--star);color:var(--btn-ink);border-color:var(--star)}
.pchip.locked{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
.pchip.nope{opacity:.4;border-style:dashed}
.times{color:var(--muted);font-size:20px}
.stepdone{color:var(--mint);font-weight:700}
.story{font-size:19px;max-width:62ch;margin:0}
.wordbank{display:flex;flex-wrap:wrap;gap:8px}
.blank{display:inline-block;min-width:120px;border-bottom:3px solid var(--star);text-align:center;color:var(--star-text);font-weight:700;padding:0 6px}
.rects{display:flex;flex-direction:column;gap:8px}
.rect{display:flex;gap:3px}
.rect span{flex:1;height:34px;border:2px solid var(--moon);border-radius:4px;background:transparent}
.rect span.on{background:var(--star);border-color:var(--star-text)}
.rect button{flex:1;height:38px;border:2px solid var(--moon);border-radius:4px;background:transparent;padding:0}
.rect button.on{background:var(--star);border-color:var(--star-text)}
.chip.txt{height:auto;min-height:46px;padding:8px 12px;font-family:var(--body);font-weight:700;font-size:16px;text-align:left;line-height:1.25;max-width:100%}
.zone .chip.txt{height:auto;font-size:15.5px}
.zones.z3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:620px){.zones.z3{grid-template-columns:1fr}}

.fig svg{max-width:100%;height:auto}
.fig{padding:10px}
.rbar{text-decoration:overline;text-decoration-thickness:2px}

/* ================= engine v2: map styles ================= */
.con .nmwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.map:not(.ms-constellation){background:var(--well);border:1px solid var(--line);border-radius:18px;padding:8px 6px}
.map.ms-trainline,.map.ms-boardgame{gap:0}
.map.ms-trainline .con,.map.ms-boardgame .con{padding-inline:0;border-radius:10px}
.map.ms-trainline,.map.ms-escape,.map.ms-boardgame{grid-template-columns:repeat(var(--n,6),minmax(0,1fr))}
.map.ms-trainline .con svg,.map.ms-escape .con svg,.map.ms-boardgame .con svg{aspect-ratio:120/72;max-width:170px}
@media (max-width:560px){.map.ms-trainline,.map.ms-escape,.map.ms-boardgame{grid-template-columns:repeat(var(--n2,3),minmax(0,1fr));row-gap:6px}}
.train.arrive{animation:trainIn .9s ease-out}
@keyframes trainIn{from{transform:translateX(-110px)}to{transform:none}}
.pawn{animation:pawnHop .5s ease-out}
@keyframes pawnHop{0%{transform:translateY(-8px)}100%{transform:none}}
.map.ms-escape{gap:4px}
.map.ms-escape .con.boss .nm,.map.ms-tower .con.boss .nm{color:var(--boss)}
/* tower: floors stacked bottom to top, rooftop boss on top; DOM order stays level 1 first */
.map.ms-tower{display:flex;flex-direction:column-reverse;gap:0;padding:10px 10px 8px}
.map.ms-tower .con{flex-direction:row;align-items:center;gap:10px;padding:0 6px;border-radius:8px;min-height:44px}
.map.ms-tower .con svg{width:132px;max-width:42%;flex:none;aspect-ratio:3/1}
.map.ms-tower .con .nmwrap{align-items:flex-start;text-align:left}
.map.ms-tower .con .nm,.map.ms-tower .con .sk{text-align:left}
.map.ms-tower .con .sk{display:block}
.cele .minimap{width:110px}
.cele .minimap svg{width:100%;height:auto}
@media (max-width:560px){.map.ms-tower .con .nm{font-size:14px}.map.ms-tower .con .sk{font-size:12px}}

/* ================= engine v2: level types ================= */
/* fixit */
.fxlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.fxstep{width:100%;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:18px;line-height:1.35;font-variant-numeric:tabular-nums}
.fxstep:hover:not(:disabled){border-color:var(--hover)}
.fxstep:disabled{cursor:default}
.fxn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sky-deep);color:var(--star-text);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:16px}
.fxt{display:flex;flex-direction:column;gap:4px}
.fxstep.ok{border-style:dashed;border-color:var(--mint)}
.fxok{font-size:14px;color:var(--mint)}
.fxstep.bad{border-color:var(--boss);background:var(--well)}
.fxstep.bad .fxt>:first-child{text-decoration:none}
.fxfix{font-weight:700;color:var(--mint)}
/* match */
.mtch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{position:relative;display:flex;align-items:center;gap:8px;text-align:left;background:var(--panel-2);border:2px solid var(--line);border-radius:14px;padding:10px 12px;min-height:56px;font-size:17px;line-height:1.3;font-variant-numeric:tabular-nums}
.mitem:hover:not(:disabled){border-color:var(--hover)}
.mitem.pick{border-color:var(--star);box-shadow:0 0 0 3px rgba(255,209,102,.3)}
.mitem.linked{border-style:solid}
.mbadge{flex:none;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:15px;color:var(--btn-ink)}
.mitem.p0{border-color:var(--star)}.mitem.p0 .mbadge{background:var(--star)}
.mitem.p1{border-color:var(--mint)}.mitem.p1 .mbadge{background:var(--mint);color:var(--mint-ink)}
.mitem.p2{border-color:var(--lilac)}.mitem.p2 .mbadge{background:var(--lilac);color:var(--sky-deep)}
.mitem.p3{border-color:var(--boss)}.mitem.p3 .mbadge{background:var(--boss);color:var(--sky-deep)}
.mitem:disabled{cursor:default}
@media (max-width:420px){.mitem{font-size:15.5px;padding:8px 10px}}
/* numberline */
.nlwrap{display:flex;flex-direction:column;gap:8px}
.nlslider{background:var(--well);border:2px solid var(--line);border-radius:16px;padding:6px 4px;cursor:pointer;touch-action:manipulation}
.nlslider:focus-visible{outline:3px solid var(--star);outline-offset:3px}
.nlslider svg{display:block;width:100%;height:auto}
.nlctl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nlctl .nlb{min-width:56px;padding:10px 16px}
.nlread{margin:0;font-size:18px;text-align:center}
.nlread b{color:var(--star-text);font-family:var(--display);font-size:22px}
/* tiles */
.tbuild{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-items:center;padding:10px;border-radius:14px;background:var(--well);border:2px dashed var(--line)}
.tph{color:var(--muted);font-size:15px}
.tbank{display:flex;flex-wrap:wrap;gap:8px}
.tk{background:var(--panel-2);border:2px solid var(--line);border-radius:12px;min-width:48px;height:50px;padding:0 12px;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.tk:hover:not(:disabled){border-color:var(--hover)}
.tk.in{border-color:var(--star)}
.tk.done{background:var(--mint);color:var(--mint-ink);border-color:var(--mint)}
/* lock */
.lockcode{display:flex;align-items:center;gap:14px;align-self:flex-start;background:var(--well);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.padlock{width:44px;height:52px}
.dials{display:flex;gap:8px}
.dial{width:44px;height:54px;border-radius:10px;border:2px solid var(--line);background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:28px;color:var(--muted)}
.dial.on{background:var(--star);border-color:var(--star);color:var(--btn-ink)}

/* ================= engine v2: contrast fixes (WCAG AA 4.5:1 for text in night, light and cream) ================= */
:root{--mint-text:var(--mint)}
:root[data-bg="light"]{--star-text:#7A4F00;--boss:#A83A0A;--mint-text:#14684A}
:root[data-bg="cream"]{--star-text:#744B00;--boss:#9A390C;--mint-text:#17654A}
.fb.good strong,.fxok,.fxfix{color:var(--mint-text)}
.mitem.p1 .mbadge{background:var(--mint-text)}
:root[data-bg="light"] .mitem.p1 .mbadge,:root[data-bg="cream"] .mitem.p1 .mbadge{color:#fff}
/* a locked node dims its picture, not its words */
.map .con.locked{opacity:1}
.map .con.locked svg{opacity:.6}
.map .con.locked .nm{color:var(--boss)}
:root{--sign-ink:var(--mint-ink)}
:root[data-bg="light"],:root[data-bg="cream"]{--sign-ink:#FFFFFF}
:root{--sky:#141A14;--sky-deep:#0B100B;--sky-top:#25331F;--panel:#1A2318;--panel-2:#23301F;--panel-b:#151D14;--line:#3E5636;--hover:#5C7F4F;--star-dim:#556B4C;--mint:#8FE3B0;--lilac:#C8C0FF;--boss:#FF8F5A}</style>
</head>

const PREF_OK={read:["button","auto"],rate:["slow","normal"],size:[0,1,2],spacing:[0,1],bg:["night","light","cream"],calm:[0,1],sound:[0,1]};

let P=loadPrefs();
function applyPrefs(){const r=document.documentElement;r.dataset.bg=P.bg;r.dataset.size=P.size;r.dataset.spacing=P.spacing;r.dataset.calm=P.calm;syncSound();}

/* ---------- state ---------- */
/* In Canvas the game runs inside the Mighty B Practice page, which keeps each student's stars on the
   server so they belong to that student and follow them to any device. Opened on its own (GitHub Pages),
   the game keeps stars in this browser only. */
const EMBED=window.parent!==window;
let KEY="mb-"+DECK.deckId, READY=!EMBED, HOSTED=false;
let S=EMBED?fresh():(load()||fresh());
function mergeState(a,b){
  const ok=s=>s&&Array.isArray(s.stars)&&s.stars.length===LEVELS.length;
  if(!ok(a)) return ok(b)?b:null; if(!ok(b)) return a;
  const n=(+a.at||0)>=(+b.at||0)?a:b, o=n===a?b:a, out=Object.assign({},n);
  out.stars=n.stars.map((v,i)=>Math.max(+v||0,+o.stars[i]||0));
  out.starred=out.stars.map((_,i)=>[...new Set([...((n.starred||[])[i]||[]),...((o.starred||[])[i]||[])])]);
  if(o.startedAt&&(!n.startedAt||o.startedAt<n.startedAt)) out.startedAt=o.startedAt;
  return out;
}
function fresh(){return {level:0,stars:LEVELS.map(()=>0),used:LEVELS.map(()=>[]),starred:LEVELS.map(()=>[]),stats:LEVELS.map(()=>({tried:0,own:0,hints:0,together:0})),streak:0,startedAt:new Date().toISOString(),best:0};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.stars&&s.stars.length===LEVELS.length?s:null;}catch(e){return null;}}
function save(){ if(!READY) return; S.at=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(HOSTED){try{window.parent.postMessage({type:"mb-save-state",deckId:DECK.deckId,state:S},MB_HOST_ORIGIN);}catch(e){}} }
const totalStars=()=>LEVELS.reduce((t,L,i)=>t+Math.min(S.stars[i],L.need),0);
const maxStars=()=>LEVELS.reduce((t,L)=>t+L.need,0);
/* Grade passback: same result object and message as every Mighty B deck. Sent each time the student earns a
   star; the host only posts a score that beats the best one already in Canvas. */
function sendResult(){
  const g=totalStars(),m=maxStars();
  const result={formatVersion:1,deckId:DECK.deckId,attemptId:uuid(),startedAt:S.startedAt,completedAt:new Date().toISOString(),
    scoreGiven:g,scoreMaximum:m,mastered:g/m>=(DECK.masteryThreshold||0.85),
    items:LEVELS.flatMap((L,i)=>Array.from({length:L.need},(_,k)=>({id:L.key+"-"+(k+1),skill:L.skill,firstTryCorrect:S.stars[i]>k,tries:k===0?S.stats[i].tried:0}))),
    levelStats:LEVELS.map((L,i)=>({id:L.key,skill:L.skill,starsOnOwn:Math.min(S.stars[i],L.need),need:L.need,tries:S.stats[i].tried,hints:S.stats[i].hints,workedTogether:S.stats[i].together}))};
  window.dispatchEvent(new CustomEvent("mb-deck-complete",{detail:result}));
  if(window.parent!==window){try{window.parent.postMessage({type:"mb-deck-complete",result},MB_HOST_ORIGIN);}catch(e){}}
}
let Q=null;

/* ---------- sound ---------- */
let ac=null;
function tone(freqs,dur=.18,gap=.09,vol=.08){ if(!P.sound||P.calm) return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;const t=ac.currentTime+i*gap;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur+.25);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur+.3);});}catch(e){} }
const sfx={good:()=>tone([659,880]),star:()=>tone([523,659,784,1047],.2,.1,.07),soft:()=>tone([392],.15,0,.04),done:()=>tone([523,659,784,988,1175],.25,.12,.07),ping:()=>tone([1047],.12,0,.05)};
function toast(t){ if(P.calm||matchMedia("(prefers-reduced-motion: reduce)").matches) return; const d=document.createElement("div");d.className="toast";d.setAttribute("aria-hidden","true");d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1400); }
function confetti(){ if(P.calm||matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=document.createElement("canvas");cv.id="confetti";document.body.appendChild(cv);const cx=cv.getContext("2d");const W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cs=["#FFD166","#7BDCB5","#B8A6FF","#FF9E7A","#F3EFE0"];const bits=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*120,y:H/3,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cs[Math.random()*cs.length|0],a:Math.random()*6}));
  let f=0;(function step(){cx.clearRect(0,0,W,H);for(const b of bits){b.vy+=.35;b.x+=b.vx;b.y+=b.vy;b.a+=.2;cx.fillStyle=b.c;cx.save();cx.translate(b.x,b.y);cx.rotate(b.a);cx.fillRect(-b.r/2,-b.r/2,b.r,b.r*.6);cx.restore();}if(++f<140)requestAnimationFrame(step);else cv.remove();})(); }

function conSVG(L,lit,big){
  const lines=L.pts.map((p,i)=>i?`L${p[0]} ${p[1]}`:`M${p[0]} ${p[1]}`).join(" ");const done=lit>=L.need;const col=L.boss?"var(--boss)":"var(--star)";

      :`<rect x="36" y="19" width="48" height="38" rx="2" fill="var(--panel-2)" stroke="var(--boss)" stroke-width="2.4"/><path d="M60 19v38" stroke="var(--boss)" stroke-width="2"/>${o.lock?LOCK_GLYPH(60,34,1.1,"var(--boss)"):`<circle cx="55" cy="39" r="2" fill="var(--boss)"/><circle cx="65" cy="39" r="2" fill="var(--boss)"/>`}`}

    const door=done

      :`<rect x="42" y="6" width="36" height="51" rx="2" fill="var(--panel-2)" stroke="var(--star-dim)" stroke-width="2"/><rect x="47" y="11" width="26" height="16" rx="1.5" fill="none" stroke="var(--line)" stroke-width="1.4"/><rect x="47" y="34" width="26" height="18" rx="1.5" fill="none" stroke="var(--line)" stroke-width="1.4"/>${LOCK_GLYPH(60,30,.95,lit?"var(--star)":"var(--star-dim)")}`;

    return `<svg ${cls} viewBox="0 0 120 72" aria-hidden="true" style="overflow:visible"><path d="${line}" fill="none" stroke="${done?col:"var(--line)"}" stroke-width="8" stroke-linecap="round" opacity="${done?.5:1}"/>${spaces}${token}</svg>`; }
};
/* draw level i's node in this game's style; o.big for the celebration card */
function nodeSVG(i,lit,o={}){ const L=LEVELS[i], lock=L.boss&&!bossOpen()&&!REVIEW, cur=firstOpen();
  const extra={lock,big:o.big}, still=o.big||o.mini;
  if(still) return NODE[MAPSTYLE](L,lit,i,extra);
  if(MAPSTYLE==="trainline"&&i===cur){ extra.train=true; extra.arrive=o.map&&lastTrainAt!==null&&cur>lastTrainAt; }
  if(MAPSTYLE==="tower") extra.here=i===cur&&!L.boss;
  if(MAPSTYLE==="boardgame") extra.token=i===(S.stars[S.level]>=LEVELS[S.level].need&&!LEVELS[S.level].boss?cur:S.level);
  return NODE[MAPSTYLE](L,lit,i,extra); }

/* ---------- map ---------- */
const REVIEW=false; // review copy: every level open. The Canvas copy keeps the boss locked until the others are lit.
const NBOSS=LEVELS.filter(L=>!L.boss).length;
function bossOpen(){return LEVELS.every((L,i)=>L.boss||S.stars[i]>=L.need);}
function renderMap(){
  const map=document.getElementById("map"), cur=firstOpen();
  map.className="map ms-"+MAPSTYLE;
  if(MAPSTYLE==="constellation") map.style.gridTemplateColumns=`repeat(${LEVELS.length},minmax(0,1fr))`;
  else { map.style.setProperty("--n",LEVELS.length); map.style.setProperty("--n2",Math.ceil(LEVELS.length/2)); }
  map.innerHTML=LEVELS.map((L,i)=>{const lock=L.boss&&!bossOpen()&&!REVIEW;const lit=Math.min(S.stars[i],L.need);return `<button class="con ${S.stars[i]>=L.need?"done":""} ${L.boss?"boss":""} ${lock?"locked":""}" type="button" data-lv="${i}" ${i===S.level?'aria-current="step"':""} aria-label="${L.name}: ${L.skill}, ${lit} of ${L.need} ${L.need===1?W1:WN}${lock?`, unlocks after the other ${NBOSS}`:""}">${nodeSVG(i,lit,{map:true})}<span class="nmwrap"><span class="nm">${L.name}</span><span class="sk">${lock?`Finish the other ${NBOSS} first`:L.skill}</span></span></button>`;}).join("");
  lastTrainAt=cur;
  document.querySelectorAll(".con").forEach(b=>b.onclick=()=>{const i=+b.dataset.lv;if(LEVELS[i].boss&&!bossOpen()&&!REVIEW){toast(TEXT.lockedToast||"Finish the other levels first!");return;}S.level=i;S.cur=null;save();newQuestion();});
}

/* ---------- picking questions ---------- */
function pickItem(li){
  const pool=LEVELS[li].pool;const starred=S.starred[li]||[];const last=S.lastIdx&&S.lastIdx[li];
  const rnd=a=>a[Math.floor(Math.random()*a.length)];
  let cand=[...pool.keys()].filter(i=>!S.used[li].includes(i)&&!starred.includes(i));
  if(!cand.length){S.used[li]=[];cand=[...pool.keys()].filter(i=>!starred.includes(i));}
  if(cand.length>1) cand=cand.filter(i=>i!==last);
  let idx=cand.length?rnd(cand):Math.floor(Math.random()*pool.length);
  S.used[li].push(idx);S.lastIdx=S.lastIdx||{};S.lastIdx[li]=idx;return {idx,item:pool[idx]};
}
function newQuestion(){
  closeReport();
  const li=S.level,L=LEVELS[li];
  if(S.stars[li]>=L.need&&!(Q&&Q.practiceMore)) return celebrate(li);
  const {idx,item}=pickItem(li);
  Q={li,idx,item,misses:0,hinted:false,hintStep:0,id:`${TEXT.idPrefix}-${L.key}-${idx+1}`,tool:null,sel:new Set(),ruled:new Set(),out:new Set(),entry:"",place:{},pick:null,seq:[]};
  S.stats[li].tried++;
  IMPL[L.key].init(item);
  save();render();
}
const IM=()=>IMPL[LEVELS[Q.li].key];

/* ---------- card chrome ---------- */
function chrome(inner,promptText){
  const L=LEVELS[Q.li];const got=Math.min(S.stars[Q.li],L.need);Q.speak=promptText;
  return `<section class="card ${L.boss?"bosscard":""}" aria-label="${L.name}">
    <div class="eyebrow"><span class="lv"><b>${L.boss?"Boss level · ":""}${L.name}</b> · ${L.skill}</span>
      <span class="starrow" aria-label="${got} of ${L.need} ${L.need===1?W1:WN}">${Array.from({length:L.need},(_,i)=>tokenSVG(i<got,i===got-1&&Q.justStarred?"pop":"")).join("")}</span></div>
    ${inner.replace("%READ%",readBtn()+toolbar())}
  </section>`;
}
const readBtn=()=>`<button class="pill readbtn" type="button" data-act="read">${ICON.speak}<span>Read to me</span></button>`;
function fbBox(){ if(!Q.fb) return ""; const f=Q.fb; return `<div class="fb ${f.kind}" role="status">${ICON[f.kind==="good"?"good":f.kind==="hint"?"hint":"look"]}<div>${f.html}<button class="fbread" type="button" data-act="readfb">${ICON.speak}Read this</button></div></div>`; }
function actionRow(o={}){
  const parts=[];
  if(o.check&&!Q.solved&&!Q.locked) parts.push(`<button class="btn" type="button" data-act="check" ${o.checkDisabled?"disabled":""}>${o.checkLabel||"Check"}</button>`);
  if(o.extra&&!Q.solved) parts.push(o.extra);
  if(o.hint!==false&&!Q.solved) parts.push(`<button class="btn ghost" type="button" data-act="hint">Show me a hint</button>`);
  if(Q.solved) parts.push(`<button class="btn" type="button" data-act="next">${Q.nextLabel||"Next "+W1}</button>`);
  return `<div class="actions">${parts.join("")}</div>`;
}

/* ---------- outcomes ---------- */
function solved(msg){
  Q.solved=true;const own=Q.misses===0&&!Q.hinted;const L=LEVELS[Q.li];
  if(own){S.stars[Q.li]++;S.starred[Q.li].push(Q.idx);S.stats[Q.li].own++;S.streak++;Q.justStarred=true;sfx.star();
    if([3,5,8].includes(S.streak)) toast(`${S.streak} in a row!`);
    const left=L.need-Math.min(S.stars[Q.li],L.need);
    Q.fb={kind:"good",html:`<p><strong>You did that on your own. ${cap(W1)} earned!</strong></p><p>${msg}</p>`};
    Q.nextLabel=left?"Next "+W1:(L.boss?(TEXT.claimBoss||"Claim your victory"):(TEXT.finishLevel||"Finish this level"));
    if(totalStars()>S.best){S.best=totalStars();sendResult();}
  } else {S.streak=0;sfx.good();
    Q.fb={kind:"good",html:`<p><strong>You got it.</strong> ${msg}</p><p>${Q.hinted?cap(WN)+" are for solving without hints":cap(WN)+" are for getting it right with no wrong tries"}, so try the next one on your own. You're ready.</p>`};
    Q.nextLabel="Try another";}
  save();
}
function miss(html){
  Q.misses++;S.streak=0;sfx.soft();
  if(Q.misses>=2&&Q.together){ Q.fb={kind:"look",html:`<p><strong>Let's work this one out together.</strong></p>${Q.together()}`};S.stats[Q.li].together++;Q.solved=true;Q.nextLabel="Try a new one on your own";Q.locked=true; }
  else Q.fb={kind:"look",html:`<p><strong>Let's look closer.</strong></p>${html}`};
  save();
}
/* a correct step inside a longer question: no star yet, no penalty */
function stepOK(html){ sfx.ping(); Q.fb={kind:"good",html}; }
function hint(){ Q.hinted=true;S.stats[Q.li].hints++;const h=Q.hints[Math.min(Q.hintStep,Q.hints.length-1)];Q.hintStep++;Q.fb={kind:"hint",html:`<p><strong>Hint</strong></p><p>${typeof h==="function"?h():h}</p>`};save();render(); }

/* ---------- widgets every game can use ---------- */
const W={
  /* multi-select tiles: Q.items = [{label, ok}] */
  tiles(aria,small){ return `<div class="tiles" role="group" aria-label="${aria}">${Q.items.map((t,i)=>{const cls=(Q.solved||Q.locked)&&t.ok?"locked":Q.ruled.has(i)?"nope":"";return `<button class="tile ${small?"small":""} ${cls}" type="button" data-t="${i}" aria-pressed="${Q.sel.has(i)}" ${Q.ruled.has(i)||Q.locked||Q.solved?"disabled":""}>${t.label}</button>`;}).join("")}</div>`; },
  /* single choice: Q.opts = [html], Q.ans = index */
  choices(aria){ return `<div class="choices" role="group" aria-label="${aria||"Choices"}">${Q.opts.map((o,i)=>{const right=(Q.solved||Q.locked)&&i===Q.ans;return `<button class="choice ${right?"right":""} ${Q.out.has(i)?"out":""}" type="button" data-opt="${i}" ${Q.out.has(i)||Q.solved||Q.locked?"disabled":""}>${o}</button>`;}).join("")}</div>`; },
  /* typed answer with a number pad */
  entry(label,after=""){ const v=Q.entry; return `<div class="entry" aria-live="polite"><span>${label}</span><span class="box ${v?"":"empty"}" aria-label="Your answer ${v||"empty"}">${v?esc(v.replace(/-/g,"−")):"tap the keys"}</span><span>${after}</span></div>`; },
  pad(){ if(Q.solved||Q.locked) return ""; const ex=Q.padKeys||[];
    const lab={"-":"negative sign","/":"fraction bar",".":"decimal point"}, face={"-":"−","/":"⁄"};
    const key=k=>k==null?"<span></span>":`<button type="button" data-key="${k}" ${lab[k]?`aria-label="${lab[k]}"`:k==="clr"?'aria-label="Clear"':k==="del"?'aria-label="Delete"':""}>${face[k]||(k==="clr"?"C":k==="del"?"⌫":k)}</button>`;
    const rows=ex.length?[["1","2","3",ex[0]],["4","5","6",ex[1]],["7","8","9",ex[2]],["clr","0","del",null]]:[["1","2","3"],["4","5","6"],["7","8","9"],["clr","0","del"]];
    return `<div class="pad ${ex.length?"wide":""}" role="group" aria-label="Number pad">${rows.flat().map(key).join("")}</div>`; },
  /* sort into boxes: Q.chips=[{id,label,zone}], Q.zones=[{key,label,sub}] */
  sort(){ const chip=c=>`<button class="chip ${String(c.label).length>4?"txt":""}" type="button" draggable="${!Q.solved}" data-chip="${c.id}" aria-pressed="${Q.pick===c.id}" ${Q.solved||Q.locked?"disabled":""}>${c.label}</button>`;
    const tray=Q.chips.filter(c=>!Q.place[c.id]);
    return `<div class="tray zone" data-zone="" aria-label="Cards to sort">${tray.map(chip).join("")||`<span class="sub" style="margin:0">All sorted. Press Check.</span>`}</div>
    <div class="zones ${Q.zones.length===3?"z3":""}">${Q.zones.map(z=>`<div class="zone" data-zone="${z.key}" tabindex="0" role="button" aria-label="${z.label} box"><span class="zl"><b>${z.label}</b>${z.sub?` · ${z.sub}`:""}</span><div class="zc">${Q.chips.filter(c=>Q.place[c.id]===z.key).map(chip).join("")}</div></div>`).join("")}</div>`; },
  /* put steps in order: Q.steps=[{id,label}], Q.order=[ids in the right order] */
  order(){ const left=Q.steps.filter(s=>!Q.seq.includes(s.id));
    return `<div class="seq" aria-label="Your order">${Q.order.map((_,i)=>{const id=Q.seq[i];const s=Q.steps.find(x=>x.id===id);return `<div class="slotline">${s?`<button class="stepchip ${Q.solved?"done":""}" type="button" data-unstep="${s.id}" ${Q.solved||Q.locked?"disabled":""} aria-label="Step ${i+1}: ${esc(s.label.replace(/<[^>]+>/g,""))}. Tap to take it back.">${s.label}</button>`:`<span class="sub" style="margin:0">Step ${i+1}</span>`}</div>`;}).join("")}</div>
      ${left.length&&!Q.solved&&!Q.locked?`<div class="bank" role="group" aria-label="Steps to place">${left.map(s=>`<button class="stepchip" type="button" data-step="${s.id}">${s.label}</button>`).join("")}</div>`:""}`; }
};
/* generic checks */
function checkTilesDefault(){
  const extra=[...Q.sel].filter(i=>!Q.items[i].ok),missing=Q.items.map((t,i)=>i).filter(i=>Q.items[i].ok&&!Q.sel.has(i));
  if(!extra.length&&!missing.length) return solved(Q.explain());
  let html="";
  if(extra.length){html+=`<p>${Q.whyNot(extra[0])} It's crossed out now.</p>`;extra.forEach(x=>{Q.sel.delete(x);Q.ruled.add(x);});}
  if(missing.length) html+=`<p>${Q.missingMsg?Q.missingMsg(missing.length):`There ${missing.length===1?"is":"are"} still ${missing.length} more to find.`}</p>`;
  miss(html);
}
function chooseDefault(i){
  if(i===Q.ans) return solved(Q.explain());
  Q.out.add(i); miss(Q.whyNot(i));
}
function checkSortDefault(){
  const wrong=Q.chips.filter(c=>Q.place[c.id]!==c.zone);
  if(!wrong.length) return solved(Q.explain());
  const c=wrong[0]; const first=!Q.misses; const placed=Q.zones.find(z=>z.key===Q.place[c.id]);
  wrong.forEach(w=>delete Q.place[w.id]);
  miss(`<p>${first?`"${esc(c.label)}" doesn't go in <b>${esc(placed?placed.label:"that box")}</b>. Think about it again.`:Q.whyChip(c)}</p><p>${wrong.length>1?`${wrong.length} cards went back to the top`:"It went back to the top"} so you can try again.</p>`);
}
function checkOrderDefault(){
  const k=Q.seq.findIndex((id,i)=>id!==Q.order[i]);
  if(k<0&&Q.seq.length===Q.order.length) return solved(Q.explain());
  const wrongStep=Q.steps.find(s=>s.id===Q.seq[k]);
  Q.seq=Q.seq.slice(0,k);
  miss(`<p>${k===0?"Step 1 isn't right yet.":`Step${k>1?"s":""} 1${k>1?`–${k}`:""} ${k>1?"are":"is"} right, but step ${k+1} isn't.`} ${Q.whyStep?Q.whyStep(k,wrongStep):""}</p><p>${k===0?"Your steps":"The steps after that"} went back so you can try again.</p>`);
}
function checkEntryDefault(){
  const v=parseAns(Q.entry);
  if(!v){ Q.fb={kind:"hint",html:`<p>Type a number first${(Q.padKeys||[]).includes("/")?" (like 7, −5 or 3/4)":""}.</p>`};return; }
  if(rEq(v,Q.answer)) { if(Q.needSimplest&&/\//.test(Q.entry)){const m=Q.entry.replace(/−/g,"-").match(/^(-?\d+)\/(-?\d+)$/); if(m&&gcd(+m[1],+m[2])>1){Q.fb={kind:"hint",html:`<p>That's the right value. Your notes ask for simplest form: can you reduce ${esc(Q.entry)}?</p>`};return;}}
    if(Q.needSimplest&&/\//.test(Q.entry)&&Q.answer.d===1){Q.fb={kind:"hint",html:`<p>That's the right value. Write it as a whole number.</p>`};return;}
    return Q.onRight?Q.onRight():solved(Q.explain()); }
  Q.entry=""; miss(Q.whyNot(v));
}

/* ---------- celebration + summary ---------- */
function celebrate(li){
  Q=null;const L=LEVELS[li];const allDone=LEVELS.every((l,i)=>S.stars[i]>=l.need);
  const nextIdx=LEVELS.findIndex((l,i)=>S.stars[i]<l.need);
  let html;
  if(allDone){
    const rows=LEVELS.map((l,i)=>{const s=S.stats[i];return `<tr><td>${l.skill}</td><td>${s.tried}</td><td>${s.own}</td><td>${s.hints}</td><td>${s.together}</td></tr>`;}).join("");
    html=`<section class="card cele"><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${LEVELS.map((l,i)=>`<div class="minimap">${nodeSVG(i,l.need,{mini:true})}</div>`).join("")}</div>
      <h2 class="prompt">${TEXT.allDoneTitle}</h2>
      <p class="sub" style="margin:0">${totalStars()} of ${maxStars()} ${WN}. ${TEXT.allDoneSub}</p>
      <div class="tablewrap"><table class="summary"><thead><tr><th>Skill</th><th>Tried</th><th>On your own</th><th>Hints</th><th>Together</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="actions" style="justify-content:center"><button class="btn soft" type="button" data-act="more" data-lv="${li}">Keep practicing</button></div></section>`;
    sfx.done();confetti();
  } else {
    const nx=LEVELS[nextIdx];const bossNext=nx.boss;
    html=`<section class="card cele">${nodeSVG(li,L.need,{big:true})}
      <h2 class="prompt">${(TEXT.levelDone||"You finished {name}!").replace("{name}",L.name).replace(/\bthe The\b/g,"The")}</h2><p class="sub" style="margin:0">${L.skill}: done on your own.${bossNext?" "+TEXT.bossWaiting:""}</p>
      <div class="actions" style="justify-content:center"><button class="btn" type="button" data-go="${nextIdx}">${bossNext?TEXT.faceBoss:"On to "+nx.name}</button>
      <button class="btn soft" type="button" data-act="more" data-lv="${li}">Practice this one more</button></div></section>`;
    sfx.done();if(L.boss)confetti();
  }
  document.getElementById("stage").innerHTML=html;renderMap();bindStage();lastAutoKey="";setTimeout(autoRead,150);
}

/* ---------- math tools (never cost a star) ---------- */
function toolbar(){
  const T=(typeof TOOLS!=="undefined"&&TOOLS)||[]; if(!T.length||(Q.noTools)) return "";
  const bar=`<div class="toolbar" role="group" aria-label="Tools"><span class="tl">${TEXT.toolsLabel||"Math tools"}</span>${T.map(([k,l])=>`<button class="pill" type="button" data-tool="${k}" aria-pressed="${Q.tool===k}">${l}</button>`).join("")}</div>`;
  return bar+(Q.tool?`<div class="tool" id="toolPanel">${toolBody(Q.tool)}</div>`:"");
}
function chartTool(){
  const [r0,c0]=Q.toolCell||[0,0];let h=`<tr><th>×</th>${Array.from({length:12},(_,j)=>`<th>${j+1}</th>`).join("")}</tr>`;
  for(let i=1;i<=12;i++){h+=`<tr><th>${i}</th>`;for(let j=1;j<=12;j++){const hit=i===r0&&j===c0,hl=!hit&&(i===r0||j===c0);h+=`<td class="${hit?"hit":hl?"hl":""}" data-cell="${i},${j}" style="width:32px;height:28px;text-align:center;border:1px solid var(--line);cursor:pointer;${hit?"background:var(--star);color:var(--btn-ink);font-weight:700":hl?"background:rgba(255,209,102,.25)":""}">${i*j}</td>`;}h+="</tr>";}
  return `<div class="scroll"><table style="border-collapse:collapse;font-size:14px" aria-label="Multiplication chart">${h.replace(/<th>/g,'<th style="width:32px;height:28px;border:1px solid var(--line);background:var(--panel-2)">')}</table></div><p class="cap">${r0?`${r0} × ${c0} = ${r0*c0}`:"Tap any number to see which row and column make it."}</p>`;
}

/* ---------- read aloud ---------- */
let readTok=0,lastAutoKey="",lastFbHtml="";
function stopReading(){readTok++;try{speechSynthesis.cancel();}catch(e){}document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));}
function sayable(t){return String(t).replace(/×/g," times ").replace(/÷/g," divided by ").replace(/\bR (\d+)/g," remainder $1").replace(/−/g," minus ").replace(/=/g," equals ").replace(/Read this/g,"").replace(/\s+/g," ").trim();}
function speakBlocks(blocks){stopReading();const tok=readTok;let i=0;
  const next=()=>{if(tok!==readTok)return;document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));if(i>=blocks.length)return;const b=blocks[i++];if(!b.text){next();return;}if(b.el)b.el.classList.add("reading");
    try{const u=new SpeechSynthesisUtterance(sayable(b.text));u.rate=P.rate==="slow"?.72:.92;u.onend=next;u.onerror=next;speechSynthesis.speak(u);}catch(e){}};next();}
function blockText(el){
  if(el.matches(".tiles")) return "Choices: "+[...el.querySelectorAll(".tile:not(.nope)")].map(t=>t.textContent).join(", ");
  if(el.matches(".choices")) return "Choices: "+[...el.querySelectorAll(".choice:not(.out)")].map(t=>t.innerText).join(". ");
  if(el.matches(".tray")) return el.querySelector(".chip")?"Cards to sort: "+[...el.querySelectorAll(".chip")].map(t=>t.textContent).join(", "):"";
  if(el.matches(".bank")) return "Steps: "+[...el.querySelectorAll(".stepchip")].map(t=>t.innerText).join(". ");
  if(el.matches(".fxlist")) return [...el.querySelectorAll(".fxstep")].map(t=>t.innerText.replace(/\n+/g," ")).join(". ");
  if(el.matches(".mtch")) return "Left: "+[...el.querySelectorAll(".mcol.l .mitem")].map(t=>t.dataset.say).join(", ")+". Right: "+[...el.querySelectorAll(".mcol.r .mitem")].map(t=>t.dataset.say).join(", ");
  if(el.matches(".tbank")) return el.querySelector(".tk")?"Tiles: "+[...el.querySelectorAll(".tk")].map(t=>t.textContent).join(", "):"";
  if(el.matches(".tool")){const c=el.querySelector(".cap");return c?c.innerText:"";}
  if(el.matches(".fb")){const c=el.cloneNode(true);c.querySelectorAll("button,svg").forEach(x=>x.remove());return c.innerText;}
  if(el.querySelector&&el.querySelector(".frac")){const c=el.cloneNode(true);c.querySelectorAll(".frac").forEach(f=>{f.textContent=` ${f.children[0].textContent} over ${f.children[1].textContent} `;});return c.innerText;}
  return el.innerText;}
function cardBlocks(onlyFb){const card=document.querySelector("#stage .card");if(!card)return[];
  return [...card.querySelectorAll(onlyFb?".fb":".story,.prompt,.eqline,.sub,.fxlist,.mtch,.nlread,.tbuild,.tbank,.lockcode,.tiles,.choices,.tray,.bank,.tool,.fb,.cele p")].filter(el=>!el.closest(".zone:not(.tray)")).map(el=>({el,text:blockText(el)}));}
function autoRead(){ if(P.read!=="auto") return; const key=Q?`${Q.id}|${Q.solved?1:0}|${Q.stage||0}`:"cele";const fb=Q&&Q.fb?Q.fb.html:"";
  if(key!==lastAutoKey){lastAutoKey=key;lastFbHtml=fb;speakBlocks(cardBlocks(false));} else if(fb&&fb!==lastFbHtml){lastFbHtml=fb;speakBlocks(cardBlocks(true));} }

/* ---------- settings ---------- */
function renderSettings(){
  const box=document.getElementById("settingsBox");const cur=k=>k==="soundx"?(P.sound&&!P.calm?1:0):P[k];
  const seg=(k,opts)=>`<span class="seg" role="group">${opts.map(([v,l,al])=>`<button type="button" data-pref="${k}" data-val="${v}" aria-pressed="${String(cur(k))===String(v)}" ${al?`aria-label="${al}"`:""}>${l}</button>`).join("")}</span>`;
  box.innerHTML=`<h2>My settings</h2>
   <div class="row"><span class="lbl">Read aloud</span>${seg("read",[["button","When I tap Read to me"],["auto","Read everything to me"]])}</div>
   <div class="row"><span class="lbl">Reading speed</span>${seg("rate",[["slow","Slower"],["normal","Normal"]])}</div>
   <div class="row"><span class="lbl">Text size</span>${seg("size",[["0","A","Normal text"],["1","A+","Bigger text"],["2","A++","Biggest text"]])}</div>
   <div class="row"><span class="lbl">Spacing</span>${seg("spacing",[["0","Normal"],["1","Extra space"]])}</div>
   <div class="row"><span class="lbl">Background</span>${seg("bg",[["night","Night"],["light","Light"],["cream","Cream"]])}</div>
   <div class="row"><span class="lbl">Calm mode</span>${seg("calm",[["0","Off"],["1","On"]])}<span class="note">No moving pieces and no sounds.</span></div>
   <div class="row"><span class="lbl">Sound</span>${seg("soundx",[["1","On"],["0","Off"]])}</div>
   <p class="note">Your settings are saved on this device. Using any setting or tool never changes your ${WN}.</p>
   <div class="actions"><button class="btn soft" type="button" id="setDone">Done</button></div>`;
  box.querySelectorAll("[data-pref]").forEach(b=>b.onclick=()=>{let k=b.dataset.pref;const v=b.dataset.val;if(k==="soundx"){k="sound";if(v==="1")P.calm=0;}P[k]=/^\d+$/.test(v)?+v:v;applyPrefs();savePrefs();renderSettings();if(k==="read"&&P.read==="auto"){lastAutoKey="";autoRead();}if(k==="read"&&P.read!=="auto")stopReading();});
  document.getElementById("setDone").onclick=toggleSettings;
}
function toggleSettings(){const box=document.getElementById("settingsBox"),b=document.getElementById("setBtn");const open=box.hidden;box.hidden=!open;b.setAttribute("aria-expanded",String(open));if(open){renderSettings();box.querySelector("button").focus();}else b.focus();}
document.getElementById("setBtn").onclick=toggleSettings;

/* ---------- keypad input ---------- */
function keyIn(k){ if(!Q||Q.solved||Q.locked||!Q.usesPad) return; let v=Q.entry;
  if(k==="clr") v=""; else if(k==="del") v=v.slice(0,-1);
  else if(k==="-"){ if(v==="") v="-"; else if(v==="-") v=""; else return; }
  else if(k==="/"){ if(!v||/[\/.]/.test(v)||v==="-") return; v+="/"; }
  else if(k==="."){ if(/[\/.]/.test(v)) return; v+=(v===""||v==="-")?"0.":"."; }
  else if(/^\d$/.test(k)){ if(v.replace(/[^\d]/g,"").length>=7) return; v+=k; }
  Q.entry=v; if(Q.fb&&Q.fb.kind!=="hint") Q.fb=null; render(); }

/* ---------- render + events ---------- */
let lastShownFb=null;
function render(){
  renderMap(); if(!Q) return;
  const v=IM().view();
  document.getElementById("stage").innerHTML=v;Q.justStarred=false;bindStage();setTimeout(autoRead,120);
  if(Q.refocus){const el=document.querySelector("#stage "+Q.refocus);Q.refocus=null;if(el)el.focus({preventScroll:true});}
  const f=document.querySelector("#stage .fb");if(f&&Q.fb!==lastShownFb){lastShownFb=Q.fb;const r=f.getBoundingClientRect();if(r.bottom>innerHeight||r.top<0)f.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches||P.calm?"auto":"smooth"});}
}
function bindStage(){
  const st=document.getElementById("stage");
  st.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==="read") return speakBlocks(cardBlocks(false));
    if(a==="readfb") return speakBlocks(cardBlocks(true));
    if(a==="hint") return hint();
    if(a==="next") return newQuestion();
    if(a==="more"){S.level=+b.dataset.lv;Q={practiceMore:true};return newQuestion();}
    if(a==="check"){IM().check();return render();}
    if(IM().act){IM().act(a);render();}
  });
  st.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.level=+b.dataset.go;newQuestion();});
  st.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{const k=b.dataset.tool;Q.tool=Q.tool===k?null:k;render();});
  st.querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{Q.tv=Q.tv||{};const [k,v]=b.dataset.tv.split(":");Q.tv[k]=v;render();});
  st.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>{Q.toolCell=b.dataset.cell.split(",").map(Number);render();});
  st.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const d=+b.dataset.t;Q.sel.has(d)?Q.sel.delete(d):Q.sel.add(d);if(IM().onTap)IM().onTap(d);Q.fb=Q.fb&&Q.fb.kind==="hint"?Q.fb:null;render();});
  st.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{const i=+b.dataset.opt;(Q.choose||IM().choose||chooseDefault)(i);render();});
  st.querySelectorAll("[data-key]").forEach(b=>b.onclick=()=>keyIn(b.dataset.key));
  st.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{Q.seq.push(b.dataset.step);if(Q.fb&&Q.fb.kind!=="hint")Q.fb=null;render();const n=document.querySelector("#stage .bank .stepchip");if(n)n.focus({preventScroll:true});});
  st.querySelectorAll("[data-unstep]").forEach(b=>b.onclick=()=>{const k=Q.seq.indexOf(b.dataset.unstep);if(k>=0)Q.seq.splice(k,1);render();});
  st.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{IM().onPc(b.dataset.pc);render();});
  st.querySelectorAll("[data-chip]").forEach(b=>{
    b.onclick=e=>{e.stopPropagation();const c=b.dataset.chip;const host=b.closest(".zones [data-zone]");
      if(host&&Q.pick!=null&&Q.pick!==c){Q.place[Q.pick]=host.dataset.zone;Q.pick=null;if(Q.fb&&Q.fb.kind!=="hint")Q.fb=null;return render();}
      Q.pick=Q.pick===c?null:c;render();};
    b.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",b.dataset.chip);e.dataTransfer.effectAllowed="move";});
  });
  st.querySelectorAll("[data-zone]").forEach(z=>{
    const place=c=>{const zone=z.dataset.zone;if(zone)Q.place[c]=zone;else delete Q.place[c];Q.pick=null;if(Q.fb&&Q.fb.kind!=="hint")Q.fb=null;render();};
    z.addEventListener("click",()=>{if(Q&&Q.pick!=null)place(Q.pick);});
    z.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&Q&&Q.pick!=null){e.preventDefault();place(Q.pick);}});
    z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("over");});
    z.addEventListener("dragleave",()=>z.classList.remove("over"));
    z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("over");const c=e.dataTransfer.getData("text/plain");if(c)place(c);});
  });
  if(Q&&Q.li!=null&&IM().bind) IM().bind(st);
  if(Q&&typeof bindTools==="function") bindTools(st);
}
document.addEventListener("keydown",e=>{ if(!Q||Q.solved||Q.locked||!Q.usesPad) return; const t=document.activeElement&&document.activeElement.tagName; if(t==="TEXTAREA"||t==="INPUT") return;
  if(/^[0-9]$/.test(e.key)) keyIn(e.key); else if(e.key==="Backspace") keyIn("del"); else if(e.key==="-"&&(Q.padKeys||[]).includes("-")) keyIn("-"); else if(e.key==="/"&&(Q.padKeys||[]).includes("/")){e.preventDefault();keyIn("/");} else if(e.key==="."&&(Q.padKeys||[]).includes(".")) keyIn(".");
  else if(e.key==="Enter"&&Q.entry){e.preventDefault();IM().check();render();} });

/* ---------- report a problem ---------- */
function closeReport(){document.getElementById("reportBox").innerHTML="";}
document.getElementById("reportBtn").onclick=()=>{
  const box=document.getElementById("reportBox");if(box.innerHTML){closeReport();return;}
  const qid=Q&&Q.id?Q.id:"(no question open)";
  box.innerHTML=`<form class="report" id="repForm"><strong>What's wrong with this question?</strong>
    <label><input type="radio" name="why" id="r1" value="answer" checked> The answer looks wrong</label>
    <label><input type="radio" name="why" id="r2" value="typo"> There's a typo</label>
    <label><input type="radio" name="why" id="r3" value="match"> It doesn't match the video or notes</label>
    <label><input type="radio" name="why" id="r4" value="other"> Something else</label>
    <textarea id="repText" placeholder="Tell us more (optional)"></textarea>
    <div class="actions"><button class="btn" type="submit">Send report</button><button class="btn soft" type="button" id="repCancel">Cancel</button></div></form>`;
  document.getElementById("repCancel").onclick=closeReport;
  document.getElementById("repForm").onsubmit=e=>{e.preventDefault();box.innerHTML=`<div class="fb good" role="status">${ICON.good}<div><p><strong>Thanks, report saved.</strong> Question ${esc(qid)} was attached.</p></div></div>`;};
};

/* ---------- top controls ---------- */
function syncSound(){const sb=document.getElementById("soundBtn");if(!sb)return;const on=!!P.sound&&!P.calm;sb.setAttribute("aria-pressed",String(on));sb.querySelector("span").textContent=on?"Sound on":"Sound off";}
document.getElementById("soundBtn").onclick=()=>{P.sound=P.sound&&!P.calm?0:1;if(P.sound)P.calm=0;applyPrefs();savePrefs();};

if(location.hash==="#mbtest") window.__mb={Q:()=>Q,S:()=>S,LEVELS,v:2,style:MAPSTYLE};   // used only by the automated play-tests
applyPrefs();
function start(){ READY=true; newQuestion(); }
if(!EMBED) start();
else{
  document.getElementById("stage").innerHTML=`<p class="prompt" role="status">${TEXT.loading||`Loading your ${WN}...`}</p>`;
  let done=false;
  window.addEventListener("message",e=>{
    if(done||e.origin!==MB_HOST_ORIGIN||e.source!==window.parent) return;
    const m=e.data; if(!m||m.type!=="mb-state"||m.deckId!==DECK.deckId||!/^[A-Za-z0-9_-]{8,64}$/.test(m.uh||"")) return;
    done=true; HOSTED=true; KEY="mb-"+DECK.deckId+"-"+m.uh;   // this student's own copy on this device
    S=mergeState(m.state,load())||fresh();
    if(!S.used||S.used.length!==LEVELS.length) S.used=LEVELS.map(()=>[]);
    if(!S.stats||S.stats.length!==LEVELS.length) S.stats=LEVELS.map(()=>({tried:0,own:0,hints:0,together:0}));
    S.cur=null; start(); save();
    if(totalStars()>0) sendResult();   // makes sure Canvas has this student's best score
  });
  try{window.parent.postMessage({type:"mb-deck-ready",deckId:DECK.deckId},MB_HOST_ORIGIN);}catch(e){}
  // Older Mighty B Practice page that doesn't answer: keep the old behavior (stars saved in this browser).
  setTimeout(()=>{ if(done) return; done=true; S=load()||fresh(); start(); },5000);
}

})();
</script>
