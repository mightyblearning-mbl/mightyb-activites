  * { box-sizing: border-box; }

  .data th { background: var(--card-alt); }
  .choices { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .choice { display: block; width: 100%; text-align: center; background: var(--card-alt); color: var(--text); border: 2px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 18px 14px; font-size: 1.05rem; font-weight: bold; font-family: inherit; cursor: pointer; transition: transform 0.15s ease, background 0.15s ease; line-height: 1.35; }

  .choice:disabled { cursor: default; }
  .choice.correct { background: var(--correct-bg); border-color: var(--accent); }
  .choice.incorrect { background: var(--wrong-bg); border-color: var(--wrong); }
  .choice.picked { border-color: var(--picked); border-width: 3px; }
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .match-col { display: grid; gap: 10px; align-content: start; }
  .match-col .choice { padding: 14px 10px; font-size: 0.98rem; }
  .match-help { color: var(--text-soft); font-size: 0.92rem; margin: -6px 0 14px; }
  .feedback { margin-top: 18px; padding: 16px 18px; border-radius: 12px; line-height: 1.55; font-size: 1rem; }
  .feedback.correct { background: var(--correct-bg); }
  .feedback.incorrect { background: var(--wrong-bg); }
  .feedback strong { display: block; margin-bottom: 4px; font-size: 1.05rem; }
  .actions { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; }
  .btn-primary { background: var(--accent); color: #06231d; border: none; border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: bold; cursor: pointer; }

  .done-card p { color: var(--text-soft); line-height: 1.6; }
  .font-lg { font-size: 1.15em; }
  footer.note { text-align: center; color: var(--text-soft); font-size: 0.8rem; margin-top: 22px; opacity: 0.8; }
  @media (max-width: 520px) {

  .score-line { font-size: 1.1rem; color: var(--text) !important; }
