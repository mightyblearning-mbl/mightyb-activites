<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 5 Practice: Circular Motion &amp; Gravitation - Mighty B Learning</title>
<style>
  :root {
    --bg: #0f2540; --card: #16345c; --card-alt: #1c3f6e; --text: #eef4fb; --text-soft: #b9cde3;
    --accent: #5fb3a3; --accent-strong: #3f9686; --wrong: #e0a45c; --wrong-bg: #3a2d1c;
    --correct-bg: #1c3a2f; --focus: #ffd166; --picked: #ffd166; --radius: 16px;
  }
  [data-contrast="high"] {
    --bg: #000000; --card: #101010; --card-alt: #1a1a1a; --text: #ffffff; --text-soft: #e6e6e6;
    --accent: #ffd166; --accent-strong: #ffca3a; --wrong: #ff8c42; --wrong-bg: #3a1f00;
    --correct-bg: #063d1f; --focus: #ffffff; --picked: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Arial, Helvetica, sans-serif; min-height: 100vh; }
  body { display: flex; justify-content: center; padding: 24px 16px 60px; }
  .wrap { width: 100%; max-width: 680px; }
  header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand { font-weight: bold; font-size: 1.05rem; color: var(--text-soft); }
  .controls { display: flex; gap: 8px; }
  .controls button { background: var(--card-alt); color: var(--text); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 10px; font-size: 0.85rem; cursor: pointer; }
  .controls button:hover { background: var(--accent-strong); }
  .controls button:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .progress-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .progress-label { font-size: 0.9rem; color: var(--text-soft); white-space: nowrap; }
  .progress-track { flex: 1; height: 10px; background: var(--card-alt); border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.4s ease; }
  .stars { font-size: 0.9rem; color: var(--text-soft); white-space: nowrap; }
  .card { background: var(--card); border-radius: var(--radius); padding: 30px 26px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .tag { display: inline-block; font-size: 0.8rem; color: var(--text-soft); background: var(--card-alt); border-radius: 999px; padding: 4px 10px; margin-bottom: 10px; }
  .question-text { font-size: 1.3rem; font-weight: bold; line-height: 1.45; margin-bottom: 18px; }
  .data { width: 100%; border-collapse: collapse; margin: 0 0 18px; font-size: 1rem; }
  .data th, .data td { border: 1px solid rgba(255,255,255,0.2); padding: 8px 10px; text-align: center; }
  .data th { background: var(--card-alt); }
  .choices { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .choice { display: block; width: 100%; text-align: center; background: var(--card-alt); color: var(--text); border: 2px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 18px 14px; font-size: 1.05rem; font-weight: bold; font-family: inherit; cursor: pointer; transition: transform 0.15s ease, background 0.15s ease; line-height: 1.35; }
  .choice:hover:not(:disabled) { transform: translateY(-1px); background: var(--accent-strong); }
  .choice:disabled { cursor: default; }
  .choice.correct { background: var(--correct-bg); border-color: var(--accent); }
  .choice.incorrect { background: var(--wrong-bg); border-color: var(--wrong); }
  .choice.picked { border-color: var(--picked); border-width: 3px; }
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .match-col { display: grid; gap: 10px; align-content: start; }
  .match-col .choice { padding: 14px 10px; font-size: 0.98rem; }
  .match-help { color: var(--text-soft); font-size: 0.92rem; margin: -6px 0 14px; }
  .feedback { margin-top: 18px; padding: 16px 18px; border-radius: 12px; line-height: 1.55; font-size: 1rem; }
  .feedback.correct { background: var(--correct-bg); }
  .feedback.incorrect { background: var(--wrong-bg); }
  .feedback strong { display: block; margin-bottom: 4px; font-size: 1.05rem; }
  .actions { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; }
  .btn-primary { background: var(--accent); color: #06231d; border: none; border-radius: 10px; padding: 12px 22px; font-size: 1rem; font-weight: bold; cursor: pointer; }
  .btn-primary:hover { background: var(--accent-strong); color: #fff; }
  .done-card { text-align: center; }
  .done-card h2 { font-size: 1.6rem; margin-bottom: 8px; }
  .done-card p { color: var(--text-soft); line-height: 1.6; }
  .font-lg { font-size: 1.15em; }
  footer.note { text-align: center; color: var(--text-soft); font-size: 0.8rem; margin-top: 22px; opacity: 0.8; }
  @media (max-width: 520px) {
    .question-text { font-size: 1.15rem; }
    .card { padding: 22px 16px; }
    .choices { grid-template-columns: 1fr; }
    .match-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="top">
    <div class="brand">Mighty B Learning &middot; Unit 5: Circular Motion &amp; Gravitation</div>
    <div class="controls">
      <button id="contrastToggle" type="button" aria-pressed="false">High contrast</button>
      <button id="fontToggle" type="button" aria-pressed="false">Larger text</button>
    </div>
  </header>
  <div class="progress-row">
    <span class="progress-label" id="progressLabel"></span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="stars" id="stars" aria-live="polite"></span>
  </div>
  <main class="card" id="card" aria-live="polite"></main>
  <footer class="note">Take your time. There's no timer, and you can try again as many times as you like.</footer>
</div>
<script>
const DECK = {
 "brand": "Unit 5: Circular Motion &amp; Gravitation",
 "wrapUp": "Remember: every circular motion needs a centripetal force pulling inward, and gravity can be that force.",
 "problems": [
  {
   "tag": "5.1 Circular Motion",
   "q": "Earth spins on its own axis every 24 hours. What is this motion called?",
   "choices": [
    "Rotation",
    "Revolution",
    "Orbit",
    "Inertia"
   ],
   "answer": "Rotation",
   "hint": "Objects rotate around an internal point.",
   "explain": "Earth rotates around its own axis (an internal point), creating day and night."
  },
  {
   "tag": "5.1 Circular Motion",
   "q": "A car drives around a large circle. The center of the circle is outside the car. What is this motion called?",
   "choices": [
    "Revolution",
    "Rotation",
    "Oscillation",
    "Displacement"
   ],
   "answer": "Revolution",
   "hint": "Objects revolve around an external point.",
   "explain": "The center of motion is outside the car, so it's revolution."
  },
  {
   "tag": "5.1 Circular Motion",
   "q": "Which way does centripetal force point?",
   "choices": [
    "Inward, toward the center of motion",
    "Outward, away from the center",
    "Straight up",
    "In the direction of motion"
   ],
   "answer": "Inward, toward the center of motion",
   "hint": "\"Centripetal\" means center-seeking.",
   "explain": "Centripetal force always points inward, toward the center of the circle."
  },
  {
   "tag": "5.1 Circular Motion",
   "q": "If the sun's gravity suddenly disappeared, what would Earth do?",
   "choices": [
    "Keep moving in a straight line",
    "Stop moving",
    "Fall into the sun",
    "Keep circling the sun"
   ],
   "answer": "Keep moving in a straight line",
   "hint": "Think about inertia: objects keep moving the way they are going unless a force acts on them.",
   "explain": "Without a centripetal force, inertia would carry Earth in a straight line."
  },
  {
   "tag": "5.2 Angular Velocity",
   "q": "How many radians are in one full circle (360°)?",
   "choices": [
    "2π",
    "π",
    "π/2",
    "4π"
   ],
   "answer": "2π",
   "hint": "Half a circle (180°) is π radians.",
   "explain": "A full circle is 360°, which equals 2π radians."
  },
  {
   "tag": "5.2 Angular Velocity",
   "q": "A fan blade rotates 4 times in 2 seconds. What is its angular velocity?",
   "choices": [
    "4π rad/s",
    "8π rad/s",
    "2π rad/s",
    "π rad/s"
   ],
   "answer": "4π rad/s",
   "hint": "4 rotations = 4 × 2π = 8π radians. Then divide by the time.",
   "explain": "ω = Δθ / Δt = 8π ÷ 2 s = 4π radians per second."
  },
  {
   "tag": "5.2 Angular Velocity",
   "q": "Two people ride the same merry-go-round. One is near the center and one is at the edge. Who has the greater linear velocity?",
   "choices": [
    "The person at the edge",
    "The person near the center",
    "They are the same",
    "Neither is moving"
   ],
   "answer": "The person at the edge",
   "hint": "They have the same angular velocity, but v = ω × r.",
   "explain": "The person at the edge has a bigger radius, so they travel a longer path and have a greater linear velocity."
  },
  {
   "tag": "5.3 Centripetal Force Lab",
   "q": "In the lab, what provides the centripetal force on the spinning tennis ball?",
   "choices": [
    "The tension of the string",
    "Air resistance",
    "The ball's color",
    "Friction with the floor"
   ],
   "answer": "The tension of the string",
   "hint": "What is pulling the ball inward toward the straw?",
   "explain": "The tension of the string pulls the ball toward the center, so it provides the centripetal force."
  },
  {
   "tag": "5.3 Centripetal Force Lab",
   "q": "In F = mv²/r, what happens to the centripetal force if the ball's velocity increases (mass and radius stay the same)?",
   "choices": [
    "It increases.",
    "It decreases.",
    "It stays the same.",
    "It becomes zero."
   ],
   "answer": "It increases.",
   "hint": "Velocity is in the top of the fraction, and it's squared.",
   "explain": "More velocity means a larger centripetal force."
  },
  {
   "tag": "5.4 Law of Gravitation",
   "q": "What happens to the force of gravity between two objects if you double ONE of the masses?",
   "choices": [
    "It doubles.",
    "It quadruples.",
    "It is cut in half.",
    "It stays the same."
   ],
   "answer": "It doubles.",
   "hint": "Gravity is directly proportional to the masses multiplied together.",
   "explain": "Double one mass and the force doubles."
  },
  {
   "tag": "5.4 Law of Gravitation",
   "q": "What happens to the force of gravity if the distance between two objects doubles?",
   "choices": [
    "It becomes 1/4 as strong.",
    "It becomes 1/2 as strong.",
    "It doubles.",
    "It stays the same."
   ],
   "answer": "It becomes 1/4 as strong.",
   "hint": "Gravity depends on 1 divided by the distance squared. What is 2²?",
   "explain": "Force is proportional to 1/d². Double the distance → 1/2² = 1/4 the force."
  },
  {
   "tag": "5.5 Mass vs. Weight",
   "q": "A space probe travels from Earth to Mars. What changes?",
   "choices": [
    "Its weight",
    "Its mass",
    "Both its mass and weight",
    "Neither"
   ],
   "answer": "Its weight",
   "hint": "Mass is the amount of matter. Does the probe lose matter on the trip?",
   "explain": "Mass is the same everywhere. Weight changes because the acceleration of gravity is different."
  },
  {
   "tag": "5.5 Mass vs. Weight",
   "q": "A 10 kg backpack is on Earth, where g = 9.8 m/s². What is its weight? (W = m × g)",
   "choices": [
    "98 N",
    "10 N",
    "9.8 N",
    "0.98 N"
   ],
   "answer": "98 N",
   "hint": "Multiply 10 × 9.8.",
   "explain": "W = m × g = 10 kg × 9.8 m/s² = 98 newtons."
  },
  {
   "tag": "5.5 Mass vs. Weight",
   "q": "A book sits on a flat table. What force from the table balances the book's weight?",
   "choices": [
    "The normal force",
    "Centripetal force",
    "Tension",
    "Magnetism"
   ],
   "answer": "The normal force",
   "hint": "It's the force from a surface that opposes weight.",
   "explain": "On a flat surface, the normal force is equal and opposite to the object's weight."
  },
  {
   "tag": "Vocabulary",
   "type": "match",
   "q": "Match each term to its meaning.",
   "hint": "Think back to the notes for each lesson.",
   "pairs": [
    [
     "Period",
     "Time to go around a complete circle once",
     "Period is the time it takes to repeat."
    ],
    [
     "Angular velocity (ω)",
     "How fast an object is rotating",
     "ω = Δθ / Δt."
    ],
    [
     "Mass",
     "The amount of matter in an object",
     "Mass is measured in kg with a balance."
    ],
    [
     "Weight",
     "Force of gravity on an object's mass",
     "W = m × g."
    ],
    [
     "Centripetal force",
     "Pulls objects toward the center of a circle",
     "It points inward."
    ]
   ],
   "explain": "Circular motion and gravity are connected: gravity is the centripetal force that keeps planets in orbit."
  }
 ]
};
const problems = DECK.problems;
let current = 0, firstTry = 0, streak = 0, bestStreak = 0, triedWrong = false;
const card = document.getElementById('card');
const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');
const starsEl = document.getElementById('stars');

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function tableHTML(t) {
  if (!t) return '';
  return '<table class="data"><tr>' + t[0].map(h => `<th>${h}</th>`).join('') + '</tr>' +
    t.slice(1).map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>';
}
function updateTop() {
  progressLabel.textContent = `Question ${Math.min(current + 1, problems.length)} of ${problems.length}`;
  progressFill.style.width = `${(current / problems.length) * 100}%`;
  starsEl.textContent = streak >= 2 ? `⭐ ${streak} in a row` : '';
}
function showNext() {
  const actions = document.getElementById('actionsArea');
  const btn = document.createElement('button');
  btn.className = 'btn-primary'; btn.type = 'button';
  btn.textContent = current === problems.length - 1 ? 'See summary' : 'Next question';
  btn.addEventListener('click', () => { if (current < problems.length - 1) { current++; render(); } else { renderDone(); } });
  actions.appendChild(btn); btn.focus();
}
function correctFeedback(p) {
  if (!triedWrong) { firstTry++; streak++; bestStreak = Math.max(bestStreak, streak); }
  updateTop();
  document.getElementById('feedbackArea').innerHTML =
    `<div class="feedback correct"><strong>${triedWrong ? 'You got it!' : 'Nice work!'}</strong>${p.explain}</div>`;
  showNext();
}
function wrongFeedback(hint) {
  if (!triedWrong) { streak = 0; updateTop(); }
  triedWrong = true;
  document.getElementById('feedbackArea').innerHTML =
    `<div class="feedback incorrect"><strong>Not quite yet. Here's a hint:</strong>${hint}</div>`;
}
function render() {
  triedWrong = false;
  const p = problems[current];
  updateTop();
  card.innerHTML = `<span class="tag">${p.tag || DECK.brand}</span>
    <div class="question-text">${p.q}</div>${tableHTML(p.table)}
    <div id="body"></div><div id="feedbackArea"></div><div class="actions" id="actionsArea"></div>`;
  if (p.type === 'match') renderMatch(p); else renderMC(p);
}
function renderMC(p) {
  const body = document.getElementById('body');
  body.innerHTML = '<div class="choices" role="group" aria-label="Answer choices"></div>';
  const wrap = body.firstChild;
  shuffle(p.choices).forEach(val => {
    const b = document.createElement('button');
    b.className = 'choice'; b.type = 'button'; b.innerHTML = val;
    b.addEventListener('click', () => {
      if (val === p.answer) {
        wrap.querySelectorAll('.choice').forEach(x => x.disabled = true);
        b.classList.add('correct'); correctFeedback(p);
      } else {
        b.classList.add('incorrect'); b.disabled = true;
        wrongFeedback((p.hints && p.hints[val]) || p.hint);
      }
    });
    wrap.appendChild(b);
  });
}
function renderMatch(p) {
  const body = document.getElementById('body');
  body.innerHTML = `<p class="match-help">Click a word on the left, then click what it matches on the right.</p>
    <div class="match-grid"><div class="match-col" id="left"></div><div class="match-col" id="right"></div></div>`;
  let picked = null, done = 0;
  const left = document.getElementById('left'), right = document.getElementById('right');
  const L = {}, R = {};
  shuffle(p.pairs).forEach(([a]) => {
    const b = document.createElement('button'); b.className = 'choice'; b.type = 'button'; b.innerHTML = a;
    b.addEventListener('click', () => { if (b.disabled) return; Object.values(L).forEach(x => x.classList.remove('picked')); b.classList.add('picked'); picked = a; });
    L[a] = b; left.appendChild(b);
  });
  shuffle(p.pairs).forEach(([a, bText]) => {
    const b = document.createElement('button'); b.className = 'choice'; b.type = 'button'; b.innerHTML = bText;
    b.addEventListener('click', () => {
      if (b.disabled) return;
      if (!picked) { wrongFeedback('First click a word on the left, then click its match here.'); return; }
      const pair = p.pairs.find(x => x[0] === picked);
      if (pair[1] === bText) {
        L[picked].classList.remove('picked'); L[picked].classList.add('correct'); L[picked].disabled = true;
        b.classList.add('correct'); b.disabled = true; picked = null; done++;
        document.getElementById('feedbackArea').innerHTML = '';
        if (done === p.pairs.length) correctFeedback(p);
      } else {
        b.classList.add('incorrect'); setTimeout(() => b.classList.remove('incorrect'), 900);
        wrongFeedback(pair[2] || p.hint);
      }
    });
    right.appendChild(b);
  });
}
function renderDone() {
  current = problems.length; updateTop();
  progressLabel.textContent = `Question ${problems.length} of ${problems.length}`;
  progressFill.style.width = '100%';
  card.innerHTML = `<div class="done-card"><h2>All done! 🎉</h2>
    <p>You worked through all ${problems.length} questions.<br>
    You got ${firstTry} of ${problems.length} on your first try, and your best streak was ${bestStreak} in a row.</p>
    <p>${DECK.wrapUp}</p>
    <div class="actions" style="justify-content:center; margin-top:20px;">
    <button class="btn-primary" type="button" id="restartBtn">Practice again</button></div></div>`;
  document.getElementById('restartBtn').addEventListener('click', () => { current = 0; firstTry = 0; streak = 0; bestStreak = 0; render(); });
}
document.getElementById('contrastToggle').addEventListener('click', function () {
  const root = document.documentElement; const isHigh = root.getAttribute('data-contrast') === 'high';
  root.setAttribute('data-contrast', isHigh ? 'normal' : 'high');
  this.setAttribute('aria-pressed', String(!isHigh)); this.textContent = isHigh ? 'High contrast' : 'Normal contrast';
});
document.getElementById('fontToggle').addEventListener('click', function () {
  const isLarge = document.getElementById('wrap').classList.toggle('font-lg');
  this.setAttribute('aria-pressed', String(isLarge)); this.textContent = isLarge ? 'Smaller text' : 'Larger text';
});
render();
</script>
</body>
</html>
